name: Build firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - name: Install pinned ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile and package
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32h2:ZigbeeMode=zczr,PartitionScheme=zigbee_zczr,CDCOnBoot=cdc,FlashSize=4M,DebugLevel=warn --build-path build firmware/HumidifierKit
          python3 scripts/test_package_ota.py
          python3 scripts/package_ota.py
      - uses: actions/upload-artifact@v4
        with:
          name: HumidifierKit-firmware
          path: |
            dist/*
            build/*.bin

